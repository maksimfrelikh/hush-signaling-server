name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: integration tests · TURN template on a real coturn
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26' # the LTS line; netcup follows it via NodeSource (deploy/DEPLOY.md § 0)
          cache: npm
      - run: npm ci
      - run: node --check signaling-server.js
      # coturn as netcup runs it: the image pinned in deploy/turn/lib.sh, behind wrappers named like
      # its binaries, so the tests and check-template.sh run it unchanged. /tmp and /var/tmp are
      # shared: configs written there reach coturn, and a log file it writes there is seen.
      - name: coturn from the pinned image
        run: |
          image=$(sed -n 's/^COTURN_IMAGE=//p' deploy/turn/lib.sh)
          docker pull -q "$image"
          for tool in turnserver turnutils_stunclient turnutils_uclient; do
            printf '#!/bin/sh\nexec docker run --rm --init --network host --user %s -v /tmp:/tmp -v /var/tmp:/var/tmp --entrypoint %s %s "$@"\n' \
              "$(id -u):$(id -g)" "$tool" "$image" | sudo tee "/usr/local/bin/$tool" >/dev/null
            sudo chmod +x "/usr/local/bin/$tool"
          done
          turnserver --version
      # turn-relay.test.ts is the only check anywhere that a credential this server mints opens an
      # allocation on a coturn holding the same secret, and that one minted from another secret is
      # refused. REQUIRE_RELAY_TEST=1 turns "coturn missing" from a skip into a failure.
      - run: npx vitest run
        env:
          REQUIRE_RELAY_TEST: '1'
      - name: The TURN template loads in coturn, authenticates with the shared secret and refuses TCP relays
        run: bash deploy/turn/check-template.sh
      - name: Shell scripts parse
        run: for f in deploy/*.sh deploy/turn/*.sh; do bash -n "$f"; done
